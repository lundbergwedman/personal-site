name = "lundbergwedman-ask"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Shown in the Ask box header too; change both together.
OPENAI_MODEL = "gpt-5.4-mini"

# 10 questions per minute per visitor.
[[ratelimits]]
name = "ASK_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60
